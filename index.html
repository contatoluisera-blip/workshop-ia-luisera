<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA como Ferramenta, Não como Atalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --s1:#0d0d0d; --s2:#141414; --s3:#1c1c1c;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --txt:#f4f4f5; --mut:#a1a1aa; --mut2:#6b6b74;
  --em:#10b981; --neon:#34d399; --mint:#a7f3d0; --jade:#065f46;
  --lar:#fb923c; --ama:#fcd34d;
  --ver:var(--neon);
  --mono:"Geist Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:Geist,Inter,system-ui,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(70vw 45vw at 90% -15%,rgba(16,185,129,.10),transparent 60%),radial-gradient(50vw 35vw at -10% 110%,rgba(16,185,129,.05),transparent 60%),var(--bg);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea{font-family:inherit;font-size:16px;color:var(--txt);background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:14px;padding:13px 15px;width:100%;outline:none;box-shadow:inset 0 2px 8px rgba(0,0,0,.6)}
input:focus,textarea:focus{border-color:rgba(16,185,129,.55);box-shadow:inset 0 2px 8px rgba(0,0,0,.6),0 0 0 1px rgba(16,185,129,.35)}
textarea{resize:vertical;min-height:92px;line-height:1.45}
.mut{color:var(--mut)} .lar{color:var(--lar)} .ver{color:var(--ver)} .mint{color:var(--mint)}
.mono{font-family:var(--mono)}
.hide{display:none!important}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 40px rgba(0,0,0,.45)}

/* ================= PLATEIA ================= */
#plateia{max-width:480px;margin:0 auto;padding:18px 18px 112px}
.p-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.p-top .marca{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.p-chip{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.p-card{border-radius:22px;padding:20px;margin-bottom:12px}
.p-card h2{font-size:23px;line-height:1.18;letter-spacing:-.02em;font-weight:600;margin-bottom:8px}
.p-card h3{font-size:17px;line-height:1.3;font-weight:600;margin-bottom:10px;letter-spacing:-.01em}
.p-card p{font-size:15px;line-height:1.55}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon);font-weight:500;margin-bottom:9px;opacity:.9}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;margin-top:9px;border-radius:15px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:15.5px;font-weight:500;line-height:1.4;transition:.15s}
.opt.sel{border-color:var(--em);background:rgba(16,185,129,.14);color:#fff;box-shadow:0 0 0 1px rgba(16,185,129,.35),0 0 18px rgba(16,185,129,.18)}
.opt:disabled{opacity:.45}
.escala{display:flex;gap:7px;margin-top:12px}
.escala .opt{text-align:center;margin:0;padding:14px 0;font-size:18px;font-weight:600}
.escala-leg{display:flex;justify-content:space-between;font-size:12px;color:var(--mut2);margin-top:6px}
.btn{display:block;width:100%;padding:15px;border-radius:99px;background:linear-gradient(180deg,#34d399,#10b981);color:#04130d;font-weight:700;font-size:15.5px;margin-top:12px;box-shadow:inset 0 2px 4px rgba(255,255,255,.35),0 6px 20px rgba(16,185,129,.28)}
.btn.sec{background:rgba(255,255,255,.05);color:#fff;border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.4}
.campo{margin-top:12px}
.campo label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.time-card{border-radius:22px;padding:22px;margin-bottom:12px;border:1px solid}
.time-card.laranja{background:rgba(251,146,60,.10);border-color:rgba(251,146,60,.45)}
.time-card.verde{background:rgba(16,185,129,.10);border-color:rgba(52,211,153,.45)}
.time-card.laranja .eyebrow{color:var(--lar)} .time-card.verde .eyebrow{color:var(--neon)}
.time-card h2{font-size:25px;line-height:1.15;letter-spacing:-.02em;font-weight:600}
.time-card p{font-size:14.5px;line-height:1.5;color:#d4d4d8;margin-top:8px}
.prompt-box{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:12px;font-weight:500;font-size:16px;line-height:1.45}
.c4{margin-top:4px}
.c4 .c{border-radius:16px;padding:13px 15px;margin-top:8px}
.c4 .c b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--neon);margin-bottom:5px;font-weight:500}
.c4 .c span{font-size:14.5px;line-height:1.5}
.c4 .c.cmd{border-color:rgba(167,243,208,.35)} .c4 .c.cmd b{color:var(--mint)}
.ok{font-size:14px;color:var(--neon);margin-top:10px;font-weight:500}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 36px);max-width:444px;border-radius:99px;padding:15px;font-weight:600;font-size:15px;z-index:20;background:rgba(20,20,20,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#0c0c0c;border-top-left-radius:26px;border-top-right-radius:26px;width:100%;max-width:480px;max-height:88vh;overflow:auto;padding:20px 18px 28px;border:1px solid var(--line)}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;padding:10px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--mut)}
.tabs button.on{background:rgba(16,185,129,.14);border-color:var(--em);color:#fff}
.q-item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.q-item .tx{flex:1;font-size:14px;line-height:1.45}
.q-item .tx small{display:block;color:var(--mut2);font-size:12px;margin-top:3px}
.mais{min-width:54px;padding:8px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:14px;font-family:var(--mono)}
.mais.on{border-color:var(--em);color:var(--neon)}
.timer-p{font-family:var(--mono);font-size:34px;font-weight:500;text-align:center;margin:6px 0 12px;letter-spacing:-.02em}
.banner{background:rgba(252,211,77,.12);border:1px solid rgba(252,211,77,.4);color:var(--ama);font-size:12.5px;font-weight:500;padding:10px 14px;border-radius:14px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.banner a{color:var(--ama);font-weight:700;white-space:nowrap}
.mini{font-size:12px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);font-weight:600;color:var(--txt)}

/* ================= TELÃO ================= */
#telao{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.t-top{display:flex;justify-content:space-between;align-items:center;padding:1.7vw 3.4vw 0;gap:2vw;min-height:5.2vw}
.t-ato{font-family:var(--mono);font-size:.95vw;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.t-ato b{color:var(--neon);font-weight:500}
.t-top .cont{display:flex;gap:1.4vw;align-items:center;font-family:var(--mono);font-size:.9vw;color:var(--mut)}
.pill{border:1px solid var(--line);border-radius:99px;padding:.4vw .95vw;color:var(--txt)}
.pill.ensaio{border-color:rgba(252,211,77,.4);color:var(--ama)}
.qr-mini{background:#fff;border-radius:.5vw;padding:.25vw;cursor:pointer;line-height:0}
.qr-mini svg{width:3.3vw;height:3.3vw}
.t-stage{flex:1;padding:1vw 6vw 6.4vw;display:flex;flex-direction:column;justify-content:center;min-height:0}
.t-eyebrow{font-family:var(--mono);font-size:1vw;letter-spacing:.16em;text-transform:uppercase;color:var(--neon);margin-bottom:1.3vw;font-weight:500}
.t-h1{font-size:5.4vw;line-height:1.02;font-weight:600;letter-spacing:-.04em}
.t-h2{font-size:3.4vw;line-height:1.08;font-weight:600;letter-spacing:-.03em}
.t-h3{font-size:2.3vw;line-height:1.15;font-weight:600;letter-spacing:-.02em}
.t-sub{font-size:1.65vw;line-height:1.5;color:#c9c9cf;margin-top:1.5vw;max-width:62vw;font-weight:400}
.t-src{font-family:var(--mono);font-size:.9vw;color:var(--mut2);margin-top:2.2vw;letter-spacing:.02em}
.em{color:var(--neon)}
.t-row{display:flex;gap:2.2vw;align-items:stretch}
.t-col{flex:1;min-width:0}
.t-card{border-radius:1.6vw;padding:2vw}
.t-card h3{font-size:1.55vw;margin-bottom:1.2vw;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.barra{margin-bottom:1vw}
.barra-top{display:flex;justify-content:space-between;font-size:1.25vw;margin-bottom:.45vw;gap:1vw}
.barra-top b{font-family:var(--mono);font-weight:500}
.trilho{height:.75vw;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.total{font-family:var(--mono);font-size:.9vw;color:var(--mut2);margin-top:.7vw}
.qr-grande{background:#fff;border-radius:1.6vw;padding:1.4vw;display:inline-block;box-shadow:0 0 60px rgba(16,185,129,.25)}
.qr-grande svg{display:block;width:21vw;height:21vw}
.url{font-family:var(--mono);font-size:1.3vw;margin-top:1.1vw;word-break:break-all;color:var(--mut)}
.big-num{font-size:8.5vw;font-weight:600;line-height:.95;letter-spacing:-.05em}
.chips{display:flex;flex-wrap:wrap;gap:.6vw;margin-top:1.4vw}
.chips span{border:1px solid var(--line);border-radius:99px;padding:.45vw 1vw;font-size:1.1vw;color:#d4d4d8}
.chips span b{margin-left:.5vw;color:var(--mut2);font-family:var(--mono);font-weight:500}
.stat{font-size:7.5vw;font-weight:600;letter-spacing:-.05em;line-height:.95}
.stat-l{font-size:1.5vw;line-height:1.4;color:#d4d4d8;margin-top:1vw;max-width:34vw}
.duel-card{border-radius:1.6vw;padding:1.8vw;position:relative}
.duel-card .ic{font-family:var(--mono);font-size:1vw;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.duel-card h3{font-size:2.6vw;margin:.5vw 0 .2vw;font-weight:600;letter-spacing:-.03em}
.duel-card .ferr{font-size:1.15vw;color:var(--mut)}
.duel-card .trilho{margin-top:1.2vw}
.duel-card .pct{position:absolute;top:1.7vw;right:1.8vw;font-family:var(--mono);font-size:1.6vw}
.duel-card.lider{border-color:rgba(52,211,153,.6);box-shadow:0 0 40px rgba(16,185,129,.18)}
.timer{font-family:var(--mono);font-size:11vw;font-weight:500;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.timer.fim{color:var(--lar)}
.slot{flex:1;border-radius:1.6vw;padding:1.6vw;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.slot .lbl,.rv-col .lbl{font-size:2.2vw;font-weight:600;margin-bottom:1vw;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.02em}
.slot .lbl small,.rv-col .lbl small{font-family:var(--mono);font-size:1vw;font-weight:500;padding:.4vw 1vw;border-radius:99px;color:#04130d}
.slot .conteudo{flex:1;min-height:0;overflow:auto;font-size:1.3vw;line-height:1.55;white-space:pre-wrap;color:#e4e4e7}
.slot .conteudo img{max-width:100%;max-height:38vh;border-radius:1vw;display:block;margin:0 auto}
.slot.vazio .conteudo{display:flex;align-items:center;justify-content:center;color:var(--mut2);text-align:center}
.slot.revel-atalho{border-color:rgba(251,146,60,.6)} .slot.revel-ferramenta{border-color:rgba(52,211,153,.6);box-shadow:0 0 40px rgba(16,185,129,.15)}
.licao{margin-top:1.4vw;display:flex;gap:1.6vw}
.licao .t-card{flex:1;padding:1.6vw}
.licao p{font-size:1.4vw;line-height:1.45}
.mural{display:grid;grid-template-columns:repeat(4,1fr);gap:.9vw;margin-top:1.6vw;max-height:56vh;overflow:hidden}
.mural .m{border-radius:1.1vw;padding:1.1vw 1.2vw;font-size:1.2vw;line-height:1.4;animation:surge .6s cubic-bezier(.2,.8,.2,1)}
.mural .m small{display:block;color:var(--mut2);font-family:var(--mono);font-size:.82vw;margin-top:.6vw}
@keyframes surge{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.c4-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw;margin-top:2vw}
.c4-grid .t-card{padding:1.6vw}
.c4-grid .t-card b{display:block;font-size:2vw;font-weight:600;letter-spacing:-.02em;margin-bottom:.7vw}
.c4-grid .t-card .n{font-family:var(--mono);font-size:.9vw;color:var(--neon);letter-spacing:.12em}
.c4-grid .t-card span{font-size:1.25vw;line-height:1.45;color:#c9c9cf}
.cmd-strip{margin-top:1.2vw;border-radius:1.4vw;padding:1.3vw 1.8vw;border:1px solid rgba(167,243,208,.35);display:flex;gap:1.4vw;align-items:center;font-size:1.35vw}
.cmd-strip b{font-family:var(--mono);color:var(--mint);font-weight:500;letter-spacing:.12em;font-size:1vw;text-transform:uppercase}
.dist{display:flex;gap:1vw;align-items:flex-end;height:17vw;margin-top:1.4vw}
.dist .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.dist .bars{display:flex;gap:.4vw;align-items:flex-end;height:100%;width:100%;justify-content:center}
.dist .b{width:40%;border-radius:.5vw .5vw 0 0;transition:height .7s}
.dist .n{font-family:var(--mono);font-size:1.1vw;margin-top:.6vw;color:var(--mut)}
.leg{display:flex;gap:2vw;font-size:1.1vw;margin-top:1vw;color:var(--mut)}
.leg i{display:inline-block;width:.9vw;height:.9vw;border-radius:.2vw;margin-right:.5vw;vertical-align:middle}
.anchor{font-size:4.4vw;font-weight:600;line-height:1.08;letter-spacing:-.04em}
.case-num{font-family:var(--mono);font-size:1vw;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.resp-certa{display:inline-block;padding:.5vw 1.3vw;border-radius:99px;font-weight:600;font-size:1.3vw;color:#04130d;margin-top:1.4vw}
.ato-num{font-family:var(--mono);font-size:1.2vw;letter-spacing:.2em;color:var(--neon);margin-bottom:1.6vw}
.ato-big{font-size:8vw;font-weight:600;letter-spacing:-.05em;line-height:.95}
.duo{display:flex;gap:2vw;margin-top:2.4vw}
.duo .t-card{flex:1;padding:2.2vw}
.duo .tag{font-family:var(--mono);font-size:.95vw;letter-spacing:.14em;text-transform:uppercase;margin-bottom:1.2vw}
.duo .q{font-size:2vw;line-height:1.3;font-weight:500;letter-spacing:-.015em}
.duo .s{font-size:1.25vw;color:var(--mut);margin-top:1.4vw;line-height:1.45}
.flow{display:flex;gap:1.2vw;align-items:stretch;margin-top:2.6vw}
.flow .t-card{padding:2vw}
.flow .arrow{display:flex;align-items:center;font-size:2.6vw;color:var(--mut2)}
.progress{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.04);z-index:39}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),var(--neon));box-shadow:0 0 12px rgba(52,211,153,.6);transition:width .6s}
.placar{display:flex;flex-direction:column;gap:1vw;margin-top:2.2vw;max-width:60vw}
.placar .r{display:flex;justify-content:space-between;align-items:center;border-radius:1.2vw;padding:1.2vw 1.6vw;font-size:1.6vw}
.placar .r b{font-family:var(--mono);font-weight:500;font-size:1.1vw;padding:.35vw .9vw;border-radius:99px;color:#04130d}

.cartas{display:grid;gap:.8vw;max-height:52vh}
.carta{aspect-ratio:1.5;border-radius:1vw;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3vw;transition:.3s}
.carta b{font-family:var(--mono);font-size:2vw;font-weight:500}
.carta span{font-size:.85vw;color:var(--mut);max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1em}
.carta.tomada{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.carta.cor-laranja{background:rgba(251,146,60,.85);border-color:#fb923c;color:#1a0a00}
.carta.cor-verde{background:rgba(52,211,153,.85);border-color:#34d399;color:#04130d}
.carta.cor-laranja span,.carta.cor-verde span{color:rgba(0,0,0,.65)}
.carta.vira{animation:vira .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes vira{0%{transform:rotateY(90deg) scale(.9);opacity:.3}100%{transform:none;opacity:1}}
.cartas-p{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
.cartas-p .opt{margin:0;text-align:center;padding:14px 0;font-family:var(--mono);font-size:17px}
.cartas-p .opt:disabled{opacity:.25}
.video-slot{aspect-ratio:16/9;width:100%;border-radius:1.4vw;overflow:hidden;position:relative}
.video-slot.sobre{border-color:var(--em)}
.vazio-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vw}

/* gráficos dos estudos */
.gf{display:flex;flex-direction:column;gap:.85vw}
.gf-g{font-family:var(--mono);font-size:.82vw;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:.6vw}
.gf-g:first-child{margin-top:0}
.gf-r{display:grid;grid-template-columns:minmax(0,15vw) 1fr 6.4vw;align-items:center;gap:1.1vw}
.gf-l{font-size:1.2vw;line-height:1.25;color:#e4e4e7}
.gf-t{position:relative;height:1.7vw;background:rgba(255,255,255,.04);border-radius:.4vw}
.gf-b{position:absolute;top:0;bottom:0;border-radius:0 .4vw .4vw 0;min-width:2px}
.gf-b.neg{border-radius:.4vw 0 0 .4vw}
.gf-z{position:absolute;top:-.4vw;bottom:-.4vw;width:2px;background:rgba(255,255,255,.35);margin-left:-1px}
.gf-v{font-family:var(--mono);font-size:1.45vw;font-weight:500;font-variant-numeric:tabular-nums;color:var(--txt)}
.gf-eixo{font-family:var(--mono);font-size:.78vw;color:var(--mut2);margin-top:.2vw}
.gf.gf-mini{gap:.5vw}.gf.gf-mini .gf-r{grid-template-columns:minmax(0,18vw) 1fr 5vw}.gf.gf-mini .gf-l{font-size:1vw}.gf.gf-mini .gf-t{height:1.1vw}.gf.gf-mini .gf-v{font-size:1.1vw}
/* estrutura de prompt */
.estr{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.estr .er{display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.4}
.estr .er b{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--neon);font-weight:500}
.estr .er i{font-style:normal;color:var(--mut);border-bottom:1px dashed rgba(52,211,153,.5);padding-bottom:1px}
.estr.t{margin-top:.4vw;gap:.55vw}
.estr.t .er{flex-direction:row;gap:1vw;font-size:1.15vw;align-items:baseline}

    async set(col, id, data) { fresco(); db[col][id] = { ...(db[col][id] || {}), ...data }; salvar(); emitir(col); },
    async del(col, id) { fresco(); delete db[col][id]; salvar(); emitir(col); },
    async add(col, data) { fresco(); const id = uid(); db[col][id] = data; salvar(); emitir(col); return id; },
    async setMany(col, entries) { fresco(); entries.forEach(([id, d]) => db[col][id] = { ...(db[col][id] || {}), ...d }); salvar(); emitir(col); },
    async toggleMais(id, pid) { fresco();
      const q = db.perguntas[id]; if (!q) return; const m = new Set(q.mais || []);
      m.has(pid) ? m.delete(pid) : m.add(pid); q.mais = [...m]; salvar(); emitir("perguntas");
    },
    async limpar() { db = vazio(); salvar(); emitirTudo(); }
  };
}

async function FirebaseStore() {
  await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js");
  await loadScript("https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-firestore-compat.js");
  firebase.initializeApp(CONFIG.firebase);
  const fs = firebase.firestore();
  const base = fs.collection("workshops").doc(CONFIG.sessao);
  const estadoRef = base.collection("meta").doc("estado");
  const erro = e => { console.error(e); avisoErro("Sem conexão com o banco: " + (e.code || e.message)); };
  return {
    modo: "ao vivo",
    listen(col, cb) {
      if (col === "estado") estadoRef.onSnapshot(s => cb(s.data() || {}), erro);
      else base.collection(col).onSnapshot(q => cb(q.docs.map(d => ({ id: d.id, ...d.data() }))), erro);
    },
    listenDoc(col, id, cb) { base.collection(col).doc(id).onSnapshot(s => cb(s.exists ? { id: s.id, ...s.data() } : null), erro); },
    setEstado(p) { return estadoRef.set(p, { merge: true }); },
    set(col, id, data) { return base.collection(col).doc(id).set(data, { merge: true }); },
    del(col, id) { return base.collection(col).doc(id).delete(); },
    async add(col, data) { const r = await base.collection(col).add(data); return r.id; },
    async setMany(col, entries) {
      for (let i = 0; i < entries.length; i += 400) {
        const b = fs.batch(); entries.slice(i, i + 400).forEach(([id, d]) => b.set(base.collection(col).doc(id), d, { merge: true })); await b.commit();
      }
    },
    toggleMais(id, pid, jaTem) {
      const F = firebase.firestore.FieldValue;
      return base.collection("perguntas").doc(id).update({ mais: jaTem ? F.arrayRemove(pid) : F.arrayUnion(pid) });
    },
    async limpar() {
      for (const col of COLS) {
        const q = await base.collection(col).get();
        for (let i = 0; i < q.docs.length; i += 400) { const b = fs.batch(); q.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
      }
      await estadoRef.set({});
    }
  };
}

function avisoErro(msg) {
  let el = document.getElementById("erro-conexao");
  if (!el) { el = document.createElement("div"); el.id = "erro-conexao"; el.style.cssText = "position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#FF6B2C;color:#000;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:99;max-width:90vw"; document.body.appendChild(el); }
  el.textContent = msg;
}

async function cliquePlateia(ev) {
  if (ev.target.id === "sheet-bg") { PL.sheet = false; renderSheet(); return; }
  const b = ev.target.closest("button,[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (b.dataset.vote) {
    const q = b.dataset.vote, o = b.dataset.o;
    PL.meusVotos[q] = o; salvarLocal(); renderPlateia();
    const extra = q.startsWith("duelo_") && E.ordemA ? { lado: o === "A" ? E.ordemA : (E.ordemA === "atalho" ? "ferramenta" : "atalho") } : {};
    try { await store.set("votos", q + "__" + PL.pid, { q, o, pid: PL.pid, t: Date.now(), ...extra }); } catch (e) { avisoErro("Não foi possível registrar o voto."); }
    return;
  }
  if (act === "entrar") {
    const nome = (PL.drafts.nome || "").trim(), funcao = (PL.drafts.funcao || "").trim();
    if (!nome) { const el = document.querySelector('[data-k="nome"]'); el && el.focus(); return; }
    b.disabled = true;
    const pid = uid();
    let time = null;
    if (E.timesSorteados) { const l = P.filter(p => p.time === "laranja").length, v = P.filter(p => p.time === "verde").length; time = l === v ? (Math.random() < 0.5 ? "laranja" : "verde") : l < v ? "laranja" : "verde"; }
    try {
      await store.set("participantes", pid, { nome: nome.slice(0, 40), funcao: funcao.slice(0, 50), t: Date.now(), ...(time ? { time } : {}) });
      PL.pid = pid; LS.set("ws-pid-" + CONFIG.sessao, pid); ouvirEu(pid);
    } catch (e) { b.disabled = false; avisoErro("Não foi possível entrar. Tente de novo."); }
    return;
  }
  if (act === "enviar") {
    const duelo = b.dataset.duelo, k = "env_" + duelo;
    const texto = (PL.drafts[k] || "").trim(); if (!texto) return;
    b.disabled = true;
    await store.add("envios", { duelo, pid: PL.pid, nome: PL.eu ? PL.eu.nome : "", time: PL.eu ? PL.eu.time : null, texto: texto.slice(0, 600), t: Date.now() });
    PL.enviados[k] = true; PL.drafts[k] = ""; salvarLocal(); renderPlateia(); return;
  }
  if (act === "responder") {
    const q = b.dataset.q, k = "resp_" + q;
    const texto = (PL.drafts[k] || "").trim(); if (!texto) return;
    b.disabled = true;
    await store.add("respostas", { q, pid: PL.pid, nome: PL.eu ? PL.eu.nome : "", texto: texto.slice(0, 280), t: Date.now() });
    if (q === "ancora") LS.set("ws-ancora-" + CONFIG.sessao, texto.slice(0, 280));
    PL.enviados[k] = true; PL.drafts[k] = ""; salvarLocal(); renderPlateia(); return;
  }
  if (act === "abrir-sheet") { PL.sheet = true; PL.flash = ""; renderSheet(); return; }
  if (act === "fechar-sheet") { PL.sheet = false; renderSheet(); return; }
  if (act === "aba") { PL.aba = b.dataset.aba; renderSheet(); return; }
  if (act === "mandar-pergunta") {
    const texto = (PL.drafts.sheet_txt || "").trim(); if (!texto) return;
    b.disabled = true;
    await store.add("perguntas", { tipo: PL.aba, texto: texto.slice(0, 400), pid: PL.pid, nome: PL.eu ? PL.eu.nome : "", t: Date.now(), mais: [], feita: false });
    PL.drafts.sheet_txt = ""; PL.flash = PL.aba === "pergunta" ? "Pergunta enviada." : "Comentário enviado."; renderSheet(); return;
  }
  if (act === "mais") {
    const id = b.dataset.id; const q = Q.find(x => x.id === id);
    await store.toggleMais(id, PL.pid, q && (q.mais || []).includes(PL.pid)); return;
  }
}

/* ---------- camadas de vídeo (fixas por cima da página, para não reiniciar a cada voto) ---------- */
function camada(key, html, alvo, classe) {
  TL.camadas.push({ key, html, alvo });
  return `<div class="${classe || ""} layer-ph" data-lk="${esc(key)}" ${alvo ? `data-alvo="${esc(alvo)}"` : ""}></div>`;
}
function sincronizarCamadas() {
  let root = document.getElementById("media-layer");
  if (!root) { root = document.createElement("div"); root.id = "media-layer"; document.body.appendChild(root); }
  const vivas = new Set();
  TL.camadas.forEach(c => {
    const ph = document.querySelector(`.layer-ph[data-lk="${CSS.escape(c.key)}"]`); if (!ph) return;
    vivas.add(c.key);
    let el = [...root.children].find(x => x.dataset.key === c.key);
    if (!el) { el = document.createElement("div"); el.className = "camada"; el.dataset.key = c.key; if (c.alvo) el.dataset.alvo = c.alvo; el.innerHTML = c.html; root.appendChild(el); }
    const r = ph.getBoundingClientRect();
    Object.assign(el.style, { display: r.width ? "block" : "none", top: r.top + "px", left: r.left + "px", width: r.width + "px", height: r.height + "px" });
  });
  [...root.children].forEach(el => { if (!vivas.has(el.dataset.key)) el.remove(); });
  root.style.display = TL.modal || E.destaque || E.mostrarAncora || TL.qrGrande ? "none" : "block";
}
function carregarVideo(f, id) {
  if (!f || !f.type.startsWith("video/")) return;
  if (TL.videos[id]) { try { URL.revokeObjectURL(TL.videos[id]); } catch (e) {} }
  TL.videos[id] = URL.createObjectURL(f); renderTelao();
}
window.addEventListener("resize", () => { if (VISAO() === "telao") sincronizarCamadas(); });

/* ---------- gráficos dos estudos (barras horizontais, rótulo direto em cada barra) ---------- */
const COR_GF = { ver: "var(--neon)", lar: "var(--lar)", mint: "var(--mint)", cinza: "#52525b" };
function fmtNum(v) { return (Math.round(v * 10) / 10).toString().replace(".", ","); }
function grafico(cfg, mini) {
  const vals = cfg.linhas.filter(r => !r.grupo).map(r => r.v);
  const min = cfg.min != null ? cfg.min : Math.min(0, ...vals), max = cfg.max != null ? cfg.max : Math.max(...vals);
  const span = max - min, zero = (0 - min) / span * 100;
  const linhas = cfg.linhas.map(r => {
    if (r.grupo) return `<div class="gf-g">${esc(r.grupo)}</div>`;
    const txt = r.fmt || ((cfg.sinal && r.v > 0 ? "+" : r.v < 0 ? "−" : "") + fmtNum(Math.abs(r.v)) + (cfg.sufixo != null ? cfg.sufixo : "%"));
    const w = Math.abs(r.v) / span * 100, left = r.v < 0 ? zero - w : zero;
    return `<div class="gf-r" title="${esc(r.l)}: ${esc(txt)}"><div class="gf-l">${esc(r.l)}</div><div class="gf-t">${min < 0 ? `<i class="gf-z" style="left:${zero}%"></i>` : ""}<div class="gf-b ${r.v < 0 ? "neg" : ""}" style="left:${left}%;width:${w}%;background:${COR_GF[r.cor] || COR_GF.ver}"></div></div><div class="gf-v">${esc(txt)}</div></div>`;
  }).join("");
  return `<div class="gf ${mini ? "gf-mini" : ""}">${linhas}${cfg.eixo ? `<div class="gf-eixo">${esc(cfg.eixo)}</div>` : ""}</div>`;
}

function parseAlvo(a) { const [duelo, lado] = String(a || "").split("|"); return DUELOS[duelo] && (lado === "atalho" || lado === "ferramenta") ? { duelo, lado, key: duelo + "__" + lado } : null; }
async function definirLink(alvo, url) {

  await store.setEstado({ midia: { ...m, [alvo.duelo]: { ...dm, [alvo.lado]: { url, t: url ? Date.now() : 0 } } } });

async function tirarMidia(alvo) {
  const vl = TL.videosLocal[alvo.key]; if (vl) { try { URL.revokeObjectURL(vl.src); } catch (e) {} delete TL.videosLocal[alvo.key]; }
  if (M.some(x => x.id === alvo.key)) { try { await store.del("midias", alvo.key); } catch (e) {} }
  await definirLink(alvo, ""); render();
}
async function receberArquivo(f, alvo) {
  if (!f || !alvo) return;
  if (f.type.startsWith("image/")) {
    try { const src = await reduzirImagem(f); await store.set("midias", alvo.key, { src, t: Date.now() }); }
    catch (e) { avisoErro("Não consegui carregar a imagem. Tente outro arquivo ou cole um link."); }
    return;
  }
  if (f.type.startsWith("video/")) {
    if (VISAO() === "palco") { avisoErro("Vídeo em arquivo só pelo telão. No celular, cole um link."); return; }
    const vl = TL.videosLocal[alvo.key]; if (vl) { try { URL.revokeObjectURL(vl.src); } catch (e) {} }
    TL.videosLocal[alvo.key] = { src: URL.createObjectURL(f), t: Date.now() }; render(); return;
  }

}
function escolherArquivo(alvo) {

  inp.onchange = () => receberArquivo(inp.files[0], alvo); inp.click();

function ligarArrastarColar() {
  document.addEventListener("mouseover", ev => { const el = ev.target.closest && ev.target.closest("[data-alvo]"); if (el) TL.alvo = parseAlvo(el.dataset.alvo); });
  document.addEventListener("dragover", ev => { if (ev.target.closest && ev.target.closest("[data-alvo],[data-case],.camada")) { ev.preventDefault(); } });
  document.addEventListener("drop", ev => {
    const el = ev.target.closest && ev.target.closest("[data-alvo],[data-case],.camada"); if (!el) return;
    ev.preventDefault(); const f = ev.dataTransfer && ev.dataTransfer.files[0];
    if (el.dataset.alvo) { const a = parseAlvo(el.dataset.alvo); if (f) receberArquivo(f, a); else { const u = ev.dataTransfer.getData("text/uri-list") || ev.dataTransfer.getData("text/plain"); if (u) definirLink(a, u.trim()); } return; }
    const caseId = el.dataset.case || (itemAtual().id === "cases" ? CASES[E.caseIdx || 0].id : null);
    if (f && caseId) carregarVideo(f, caseId);
  });
  document.addEventListener("paste", ev => {
    if (TL.modal || /INPUT|TEXTAREA/.test(document.activeElement.tagName) || itemAtual().id !== "duelos") return;
    const id = E.duelo || ORDEM_DUELOS[0];
    const alvo = TL.alvo && TL.alvo.duelo === id ? TL.alvo : null; if (!alvo) { avisoErro("Passe o mouse sobre o quadro do resultado antes de colar."); return; }
    const f = [...(ev.clipboardData.files || [])][0]; if (f) { ev.preventDefault(); receberArquivo(f, alvo); return; }
    const txt = (ev.clipboardData.getData("text") || "").trim(); if (/^(https?:|data:image)/.test(txt)) { ev.preventDefault(); definirLink(alvo, txt); }
  });
}

function rotuloProximo() {
  const it = itemAtual(); const sub = E.sub;

  const seguir = prox ? prox.titulo : "Fim";
  switch (it.id) {
    case "medico": if (sub !== "licao") return "Lição"; break;
    case "quiz": if (sub === "votacao") return "Revelar"; if ((E.quizIdx || 0) < QUIZ.length - 1) return "Próximo quiz"; break;
    case "times": if (!E.cartas) return "Distribuir cartas"; if (!E.todasViradas) return "Virar todas"; break;
    case "duelos": {
      if (!E.duelo) return "Abrir duelo de Prompt";
      if (sub === "briefing") return "Iniciar produção";
      if (sub === "producao") return "Votação";
      if (sub === "votacao") return "Revelar";

      break;
    }

}

/* ---------- registro das respostas (planilha) ---------- */
const temRespostas = () => P.length + V.length + R.length + S.length + Q.length > 0;
function rotuloOpt(opts, o) { const x = (opts || []).find(k => k.v === o); return x ? x.l : o; }
function descreverVoto(v) {
  const q = v.q || "", o = v.o;
  const simples = [Q_USOU, Q_CONFERIU, Q_MEDICO1].find(x => x.id === q);
  if (simples) return [simples === Q_MEDICO1 ? "Analogia do médico" : "Provocação", simples.titulo, rotuloOpt(simples.opts, o)];
  if (q === Q_CONF_ANTES.id) return ["Provocação", Q_CONF_ANTES.titulo, o + " de 5"];
  if (q === Q_CONF_DEPOIS.id) return ["Os 4 Cs, antes e depois", Q_CONF_DEPOIS.titulo, o + " de 5"];
  const qz = QUIZ.find(x => x.id === q);
  if (qz) return ["Quiz", qz.titulo, String(o).toUpperCase() + ") " + rotuloOpt(qz.opts, o) + (o === qz.certo ? " (certa)" : "")];
  if (q.startsWith("case_")) { const c = CASES.find(x => "case_" + x.id === q); return ["Cases", c ? c.nome : q, rotuloOpt(OPTS_CASE, o)]; }
  if (q.startsWith("cumpre_")) { const d = DUELOS[q.slice(7)]; return [d ? d.rodada : q, "Cumpre o briefing?", rotuloOpt(OPTS_CUMPRE, o)]; }
  if (q.startsWith("duelo_")) { const d = DUELOS[q.slice(6)];
    const lado = v.lado ? (v.lado === "ferramenta" ? " (prompt completo, Time Verde)" : " (prompt curto, Time Laranja)") : "";
    return [d ? d.rodada : q, d && d.verde ? "Qual cumpre melhor o briefing?" : "Qual resultado é melhor?", "Resultado " + o + lado]; }
  return [q, q, o];
}
function tituloResposta(q) {
  if (q === "ancora") return ["Pergunta-âncora", CONFIG.perguntaAncora];
  const it = ROTEIRO.find(x => x.id === q); return [it ? it.titulo : q, it ? it.titulo : q];
}
function linhasRegistro() {
  const pes = {}; P.forEach(p => pes[p.id] = p);
  const quem = (pid, nome) => { const p = pes[pid] || {}; return [p.nome || nome || "", p.funcao || "", p.time ? nomeTime(p.time) : ""]; };
  const L = [];
  P.forEach(p => L.push([p.t, ...quem(p.id), "Entrada", "Entrou no workshop", "Função: " + (p.funcao || "-")]));
  V.forEach(v => { const [m, perg, resp] = descreverVoto(v); L.push([v.t, ...quem(v.pid), m, perg, resp]); });
  R.forEach(r => { const [m, perg] = tituloResposta(r.q); L.push([r.t, ...quem(r.pid, r.nome), m, perg, r.texto]); });
  S.forEach(x => { const d = DUELOS[x.duelo]; L.push([x.t, ...quem(x.pid, x.nome), d ? d.rodada : x.duelo, x.time === "laranja" ? PERGUNTAS_LARANJA : PERGUNTAS_VERDE, x.texto]); });
  Q.forEach(x => L.push([x.t, ...quem(x.pid, x.nome), x.tipo === "pergunta" ? "Pergunta para o palestrante" : "Comentário", x.tipo === "pergunta" ? "Pergunta" : "Comentário", x.texto]));
  return L.sort((a, b) => (a[0] || 0) - (b[0] || 0));
}
function exportarRespostas() {
  const cel = x => { const t = x == null ? "" : String(x); return /[";\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const data = t => t ? new Date(t).toLocaleString("pt-BR").replace(",", "") : "";
  const cab = ["Data e hora", "Pessoa", "Função", "Time", "Momento", "Pergunta", "Resposta"];
  const linhas = linhasRegistro().map(([t, ...r]) => [data(t), ...r]);
  const csv = "﻿" + [cab, ...linhas].map(l => l.map(cel).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const d = new Date(), dd = n => String(n).padStart(2, "0");
  a.download = `respostas-${CONFIG.sessao}-${d.getFullYear()}-${dd(d.getMonth() + 1)}-${dd(d.getDate())}-${dd(d.getHours())}h${dd(d.getMinutes())}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function drawerHTML() {

async function ir(patch) {
  TL.hist.push(CHAVES_ESTADO.reduce((o, k) => (o[k] = E[k] === undefined ? null : E[k], o), {}));
  if (TL.hist.length > 80) TL.hist.shift();
  await store.setEstado(patch);
}
function entrarPatch(it) {
  const base = { sub: null, votacao: false, timerFim: null, duelo: null };
  switch (it.id) {
    case "provocacao": return { ...base, votacao: true };
    case "medico": return { ...base, sub: "votacao", votacao: true };
    case "quiz": return { ...base, sub: "votacao", quizIdx: 0, votacao: true };
    case "duelos": return { ...base, ...patchDuelo(ORDEM_DUELOS[0]), feitos: [], placar: {} };
    case "cases": return { ...base, sub: "votacao", caseIdx: 0, votacao: true };
    case "compromisso": case "final": return { ...base, votacao: true };
  }
  return base;
}
const irPasso = i => { i = Math.max(0, Math.min(ROTEIRO.length - 1, i)); return ir({ passo: i, ...entrarPatch(ROTEIRO[i]) }); };
async function distribuirCartas() {
  if (!P.length) { avisoErro("Ninguém conectado ainda."); return; }
  const ordem = shuffle(P); const N = ordem.length;
  const cores = shuffle(ordem.map((_, i) => i % 2 === 0 ? "laranja" : "verde"));
  const cartas = {}, dono = {}, upd = [];
  ordem.forEach((p, i) => { const k = i + 1; cartas[k] = cores[i]; dono[k] = p.id; upd.push([p.id, { carta: k, time: cores[i] }]); });
  TL.cartasVistas.clear();
  await store.setMany("participantes", upd);
  await ir({ cartas, cartasDono: dono, viradas: [], todasViradas: false, timesSorteados: true });
}
function virarCarta(n) { if (!E.cartas || (E.viradas || []).includes(n)) return; return ir({ viradas: [...(E.viradas || []), n] }); }
function patchDuelo(id) { return { duelo: id, sub: "briefing", votacao: !!DUELOS[id].verde, ordemA: Math.random() < 0.5 ? "atalho" : "ferramenta", timerFim: null, vencedor: null }; }
function proximoDuelo() { const i = ORDEM_DUELOS.indexOf(E.duelo); return i >= 0 && i < ORDEM_DUELOS.length - 1 ? ORDEM_DUELOS[i + 1] : null; }
function abrirDuelo(id) {
  const passoDuelos = ROTEIRO.findIndex(x => x.id === "duelos");
  return ir({ passo: passoDuelos, ...patchDuelo(id) });
}
async function proximo() {
  const it = itemAtual(); const sub = E.sub;
  switch (it.id) {
    case "medico": if (sub !== "licao") return ir({ sub: "licao" }); break;
    case "quiz":
      if (sub === "votacao") return ir({ sub: "revelacao", votacao: false });
      if ((E.quizIdx || 0) < QUIZ.length - 1) return ir({ sub: "votacao", quizIdx: (E.quizIdx || 0) + 1, votacao: true });
      break;
    case "times": if (!E.cartas) return distribuirCartas(); if (!E.todasViradas) return ir({ todasViradas: true }); break;
    case "duelos":
      if (!E.duelo) return abrirDuelo(ORDEM_DUELOS[0]);
      if (sub === "briefing") return ir({ sub: "producao", timerFim: Date.now() + CONFIG.minutosProducao * 60000, votacao: !!DUELOS[E.duelo].verde });
      if (sub === "producao") return ir({ sub: "votacao", votacao: true, timerFim: null });
      if (sub === "votacao") {
        const f = (E.feitos || []).filter(x => x !== E.duelo); f.push(E.duelo);
        const v = vencedorDuelo(E.duelo);
        return ir({ sub: "revelacao", votacao: false, feitos: f, vencedor: v, placar: { ...(E.placar || {}), [E.duelo]: v || "empate" } });
      }
      if (sub === "revelacao" && proximoDuelo()) return ir(patchDuelo(proximoDuelo()));
      break;
    case "cases":
      if (sub !== "revelacao") return ir({ sub: "revelacao", votacao: false });
      if ((E.caseIdx || 0) < CASES.length - 1) return ir({ caseIdx: (E.caseIdx || 0) + 1, sub: "votacao", votacao: true });

}

      return votar(Q_CONF_ANTES.id, () => pick(["2", "3", "3", "4", "4", "5"]));
    case "medico":
      return votar(Q_MEDICO1.id, () => pick(["pergunta", "pergunta", "pergunta", "pergunta", "receita", "google"]));
    case "times": if (E.cartas && !E.todasViradas) { const ab = Object.keys(E.cartas).map(Number).filter(k => !(E.viradas || []).includes(k)); if (ab.length) return virarCarta(pick(ab)); } break;
    case "quiz": if (E.sub === "votacao") { const qz = QUIZ[E.quizIdx || 0]; return votar(qz.id, () => Math.random() < .55 ? "c" : pick(["a", "b"])); } break;
    case "duelos": {
      if (!E.duelo) break;
      if (DUELOS[E.duelo].verde && (E.sub === "producao" || E.sub === "briefing")) {
        const ls = fakes.filter(p => p.time === "laranja"), vs = fakes.filter(p => p.time === "verde");
        await store.setMany("votos", vs.map(p => ["cumpre_" + E.duelo + "__" + p.id, { q: "cumpre_" + E.duelo, o: pick(["sim", "sim", "sim", "parte", "nao"]), pid: p.id, t: Date.now() }]));
        if (ls.length) { const f = pick(ls); await store.add("envios", { duelo: E.duelo, pid: f.id, nome: f.nome, time: "laranja", texto: pick(["Faltou dizer a idade dele e o que ele vende", "Que hora do dia? Tem sol?", "Qual o formato: feed ou stories?", "Faltou dizer que é Ipanema ou Copacabana", "Que estilo: foto ou desenho?"]), t: Date.now() }); }
        if (vs.length) { const f = pick(vs); await store.add("envios", { duelo: E.duelo, pid: f.id, nome: f.nome, time: "verde", texto: pick(["Eu trocaria a luz para o meio-dia", "Cumpre tudo, só tiraria o dente de ouro", "Colocaria a marca na camiseta", "Deixaria mais espaço para o texto"]), t: Date.now() }); }
        return;
      }
      else if (E.sub === "producao" || E.sub === "briefing") { const vs = fakes.filter(p => p.time === "verde"); const f = pick(vs.length ? vs : fakes);
        return store.add("envios", { duelo: E.duelo, pid: f.id, nome: f.nome, time: "verde", texto: pick(["Luz de fim de tarde vindo de trás da flor", "Lente macro, bem perto do miolo, fundo desfocado", "Campo de girassóis ao fundo, céu limpo", "Gotas de orvalho nas pétalas", "Vento leve balançando as pétalas", "Formato vertical para o Reels"]), t: Date.now() }); }
      if (E.sub === "votacao") { const bom = E.ordemA === "ferramenta" ? "A" : "B", ruim = bom === "A" ? "B" : "A";
        return store.setMany("votos", fakes.map(p => { const o = Math.random() < 0.72 ? bom : ruim; return ["duelo_" + E.duelo + "__" + p.id, { q: "duelo_" + E.duelo, o, pid: p.id, t: Date.now(), lado: o === bom ? "ferramenta" : "atalho" }]; })); }
      break;
    }
    case "cases": { const c = CASES[E.caseIdx || 0]; return votar("case_" + c.id, () => Math.random() < 0.6 ? c.certo : pick(["atalho", "ferramenta", "depende"])); }
    case "etica": return resp("etica", ["Na voz de alguém sem autorização", "Em depoimento real de cliente", "Em dado que eu não consigo conferir", "Para substituir minha opinião", "Em contrato sem revisão"]);
    case "compromisso": case "final":
      await votar(Q_CONF_DEPOIS.id, () => pick(["1", "2", "2", "3", "3"]));
      return resp("compromisso", ["O que você precisa saber sobre meu público antes de sugerir pautas?", "Como eu deveria pedir este vídeo para a IA de geração?", "Que perguntas faltam para montar minha proposta?"]);
  }
  const f = pick(fakes);
  return store.add("perguntas", { tipo: "pergunta", texto: pick(["Qual IA você usa para vídeo?", "Quanto custa por mês usar tudo isso?", "Como evitar rosto deformado no vídeo?", "Vale a pena pagar plano de IA?"]), pid: f.id, nome: f.nome, t: Date.now(), mais: fakes.slice(0, Math.floor(Math.random() * 8)).map(p => p.id), feita: false });
}

function telaPin(seguir) {
  document.getElementById("app").innerHTML = `<div class="pin"><div class="eyebrow">Acesso do apresentador</div><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="btn" style="width:240px" id="pin-ok">Entrar</button><a href="#" class="mut" style="font-size:13px">Sou da plateia</a></div>`;
  const ok = () => { if (document.getElementById("pin").value === CONFIG.pinTelao) { SS.set("ws-pin", CONFIG.pinTelao); seguir(); } else document.getElementById("pin").value = ""; };
  document.getElementById("pin-ok").onclick = ok;
  document.getElementById("pin").addEventListener("keydown", e => { if (e.key === "Enter") ok(); });
}
let iniciado = null;
async function iniciar() {
  if (!store) {
    if (CONFIG.firebase) { try { store = await FirebaseStore(); } catch (e) { avisoErro("Não consegui conectar ao Firebase. Rodando em modo ensaio."); store = LocalStore(); } }
    else store = LocalStore();
  }
  const modo = VISAO();
  if (iniciado && iniciado !== modo) { location.reload(); return; }
  if (iniciado) return;
  if (modo !== "plateia" && CONFIG.pinTelao && SS.get("ws-pin") !== CONFIG.pinTelao) { telaPin(iniciar); return; }
  iniciado = modo;
  if (modo === "telao") iniciarTelao(); else if (modo === "palco") iniciarPalco(); else iniciarPlateia();
}
window.addEventListener("hashchange", () => { if (iniciado) location.reload(); else iniciar(); });
iniciar();
</script>
